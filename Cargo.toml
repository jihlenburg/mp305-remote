[workspace]
resolver = "2"
members = ["crates/mp305-core", "crates/mp305-app", "crates/mp305-py"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only WITH Commons-Clause"
repository = "https://github.com/jihlenburg/mp305-remote"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
missing_docs_in_private_items = "warn"

# A stripped cdylib does not load on macOS (ADR-0015).
[profile.release]
strip = "none"

[package]
name = "mp305-app"
description = "Desktop remote control for the ISDT MP305B bench power supply"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# eframe 0.36.2 and egui_plot 0.37.0 need Rust 1.95 (app DD, section 8,
# decision 10); the core and the Python crate keep the workspace's 1.85.
rust-version = "1.95"

[lints]
workspace = true

[build-dependencies]
# Embed the native executable icon for Windows targets (DD-APP-040).
winresource = "0.1.31"

[dependencies]
mp305-core = { path = "../mp305-core" }
# The pre-1.0 GUI crates are pinned exactly (ADR-0005; app DD, section 8,
# decision 1). Default features: the wgpu renderer, so `on_exit(&mut self)`.
eframe = "=0.36.2"
egui_plot = "=0.37.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
directories = "6"
# Host-local names, saved atomically off the UI thread (DD-APP-015).
serde_json = "1"
tempfile = "3"

# The version eframe resolves; it gives `EventLoopBuilderExtMacOS`, which
# eframe does not re-export (DD-APP-023).
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false }

[dev-dependencies]
mp305-core = { path = "../mp305-core", features = ["mock"] }
tokio = { version = "1", features = ["test-util"] }
egui_kittest = { version = "=0.36.2", features = ["eframe", "wgpu", "snapshot"] }

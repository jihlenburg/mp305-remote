[package]
name = "mp305-core"
description = "Protocol, transports and device API for the ISDT MP305B bench power supply"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Scripted transport doubles for integration tests and the Python test constructor.
mock = []

[dependencies]
btleplug = "0.13"
directories = "6"
futures = "0.3"
getrandom = "0.4"
hidapi = "2.6"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
uuid = "1"

[dev-dependencies]
mp305-core = { path = ".", features = ["mock"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
